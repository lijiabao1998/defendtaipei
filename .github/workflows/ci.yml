name: CI
# Checks every pull request before it reaches main (pushes to main are built and deployed by pages.yml).
# The browser checks use software WebGL on the runner, so they are slow (the story check takes ~11 min).
on:
  push:
    branches: [test/help-loot-layout-20261030]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Types, format, unit checks, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check .
      - name: Unit checks (bus, save, map tiles, story)
        run: node scripts/checks/modules.mjs
      - name: English localization contracts
        run: node scripts/checks/i18n.mjs
      - run: npm run build

  browser:
    name: Browser – ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mobile left joystick
            script: scripts/checks/mobile-left-joystick.mjs
          - name: English language and mobile layout
            script: scripts/checks/english-browser.mjs
          - name: smoke
            script: scripts/smoke.mjs
          - name: story save lifecycle
            script: scripts/checks/story-lifecycle.mjs
          - name: alert test tone
            script: scripts/checks/v2321testtone.mjs
          - name: enterable district buildings
            script: scripts/checks/v233enter.mjs
          - name: upstairs floors
            script: scripts/checks/v234upstairs.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node ${{ matrix.script }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ strategy.job-index }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

  help-layout:
    name: Help and loot – ${{ matrix.device }} / ${{ matrix.lang }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
        lang: [zh-TW, en]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/checks/help-loot-layout.mjs
        env:
          HELP_DEVICE: ${{ matrix.device }}
          HELP_LANG: ${{ matrix.lang }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: help-loot-${{ matrix.device }}-${{ matrix.lang }}
          path: shots/
          retention-days: 7
